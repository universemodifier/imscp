# DOVECOT(1) configuration file - auto-generated by i-MSCP
#     DO NOT EDIT THIS FILE BY HAND -- YOUR CHANGES WILL BE OVERWRITTEN
#
# Dovecot 2.4 configuration. Ubuntu 24.04 still uses the 2.3 file.

dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

default_client_limit = {DOVECOT_DEFAULT_CLIENT_LIMIT}

mail_driver = maildir
mail_path = ~/
mail_uid = {MTA_MAILBOX_UID}
mail_gid = {MTA_MAILBOX_GID}

namespace inbox {
    separator = .
    prefix = INBOX.
    inbox = yes
    type = private

    mailbox Drafts {
        special_use = \Drafts
        auto = subscribe
    }

    mailbox Junk {
        special_use = \Junk
        auto = subscribe
    }

    mailbox Sent {
        special_use = \Sent
        auto = subscribe
    }

    mailbox Trash {
        special_use = \Trash
        auto = subscribe
        quota_storage_extra = 100M
    }
}

mail_plugins {
    quota = yes
}

quota "User quota" {
    driver = maildir
    storage_size = 1G
}

passdb sql {
    default_password_scheme = SHA512-CRYPT
    query = SELECT \
        CONCAT('{MTA_VIRTUAL_MAIL_DIR}/', SUBSTRING(mail_addr, LOCATE('@', mail_addr) + 1), '/', mail_acc, '/') AS 'userdb_home', \
        '{MTA_MAILBOX_UID}' AS 'userdb_uid', \
        '{MTA_MAILBOX_GID}' AS 'userdb_gid', \
        CONCAT(quota, 'B') AS 'userdb_quota_storage_size', \
        mail_pass AS password \
        FROM mail_users \
        WHERE mail_addr = '%{user}' \
        AND status = 'ok' \
        AND po_active = 'yes'
}

userdb prefetch {
}

userdb sql {
    query = SELECT \
        CONCAT('{MTA_VIRTUAL_MAIL_DIR}/', SUBSTRING(mail_addr, LOCATE('@', mail_addr) + 1), '/', mail_acc, '/') AS home, \
        '{MTA_MAILBOX_UID}' AS 'uid', \
        '{MTA_MAILBOX_GID}' AS 'gid', \
        CONCAT(quota, 'B') AS 'quota_storage_size' \
        FROM mail_users \
        WHERE mail_addr = '%{user}' \
        AND status = 'ok' \
        AND po_active = 'yes'
    iterate_query = SELECT mail_addr AS user FROM mail_users WHERE mail_type LIKE '%%_mail%%' AND status <> 'todelete'
}

sql_driver = mysql
mysql {DATABASE_HOST} {
    port = {DATABASE_PORT}
    user = {DATABASE_USER}
    password = "{DATABASE_PASSWORD}"
    dbname = {DATABASE_NAME}
}

auth_mechanisms = plain login
auth_allow_cleartext = yes

service auth {
    unix_listener auth-master {
        mode = 0600
        user = {MTA_MAILBOX_UID_NAME}
    }

    unix_listener {DOVECOT_SASL_AUTH_SOCKET_PATH} {
        mode = 0660
        user = {POSTFIX_USER}
        group = {POSTFIX_GROUP}
    }
}

service imap-login {
    process_limit = {DOVECOT_IMAP_LOGIN_PROCESS_LIMIT}
    process_min_avail = {DOVECOT_IMAP_LOGIN_PROCESS_MIN_AVAIL}
    service_restart_request_count = {DOVECOT_IMAP_LOGIN_PROCESS_SERVICE_COUNT}
}

service imap {
    process_limit = {DOVECOT_IMAP_PROCESS_LIMIT}
    process_min_avail = {DOVECOT_IMAP_PROCESS_MIN_AVAIL}
    service_restart_request_count = {DOVECOT_IMAP_PROCESS_SERVICE_COUNT}
    vsz_limit = {DOVECOT_IMAP_VSZ_LIMIT}
}

service pop3-login {
    process_limit = {DOVECOT_POP3_LOGIN_PROCESS_LIMIT}
    process_min_avail = {DOVECOT_POP3_LOGIN_PROCESS_MIN_AVAIL}
    service_restart_request_count = {DOVECOT_POP3_LOGIN_PROCESS_SERVICE_COUNT}
}

service pop3 {
    process_limit = {DOVECOT_POP3_PROCESS_LIMIT}
    process_min_avail = {DOVECOT_POP3_PROCESS_MIN_AVAIL}
    service_restart_request_count = {DOVECOT_POP3_PROCESS_SERVICE_COUNT}
}

service quota-warning {
    executable = script {ENGINE_ROOT_DIR}/quota/imscp-dovecot-quota.sh
    group = {IMSCP_GROUP}

    unix_listener quota-warning {
        mode = 0600
        user = {MTA_MAILBOX_UID_NAME}
    }
}

listen = {NETWORK_PROTOCOLS}
mail_max_userip_connections = {DOVECOT_MAX_USERIP_CONNECTIONS}

protocols {
    imap = yes
    pop3 = yes
}

protocol imap {
    mail_plugins {
        quota = yes
        imap_quota = yes
    }
}

protocol pop3 {
    mail_plugins {
        quota = yes
    }
}

protocol lda {
    mail_plugins {
        quota = yes
        sieve = yes
    }
    postmaster_address = postmaster@{HOSTNAME}
}

sieve_script personal {
    driver = file
    path = ~/sieve
    active_path = ~/.dovecot.sieve
}

!include_try {DOVECOT_CONF_DIR}/imscp.d/*.conf
